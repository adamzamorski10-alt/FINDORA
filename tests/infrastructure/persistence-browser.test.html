<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>G3.3 Persistence Composition — Browser Tests</title>
</head>
<body>
  <pre id="output">Running persistence composition browser tests...</pre>
  <script type="module">
    import { createPersistence } from '../../../src/infrastructure/persistence.js';
    import { IndexedDBStorageAdapter } from '../../../src/infrastructure/storage/indexeddb-storage-adapter.js';

    const output = document.getElementById('output');
    let passed = 0;
    let failed = 0;
    const results = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message || 'Assertion failed');
    }

    function assertDeepEqual(actual, expected, message) {
      if (JSON.stringify(actual) !== JSON.stringify(expected)) {
        throw new Error(message || 'Deep equal failed');
      }
    }

    async function runTest(name, fn) {
      try {
        await fn();
        passed++;
        results.push('✔ ' + name);
      } catch (e) {
        failed++;
        results.push('✖ ' + name + ': ' + e.message);
      }
    }

    async function runAllTests() {
      const dbName = 'persistence-composition-test-' + Date.now();
      const storage = new IndexedDBStorageAdapter(dbName);
      const persistence = createPersistence({ storageAdapter: storage, userId: 'test-user' });
      await persistence.initialize();

      await runTest('Persistence: all repositories present', async () => {
        assert(persistence.storage, 'Expected storage');
        assert(persistence.userRepository, 'Expected userRepository');
        assert(persistence.accountRepository, 'Expected accountRepository');
        assert(persistence.categoryRepository, 'Expected categoryRepository');
        assert(persistence.transactionRepository, 'Expected transactionRepository');
        assert(persistence.budgetRepository, 'Expected budgetRepository');
        assert(persistence.goalRepository, 'Expected goalRepository');
      });

      await runTest('Persistence: userId propagated', async () => {
        assert(persistence.userId === 'test-user', 'Expected userId=test-user');
        assert(persistence.accountRepository.userId === 'test-user', 'Expected accountRepository.userId=test-user');
        assert(persistence.categoryRepository.userId === 'test-user', 'Expected categoryRepository.userId=test-user');
        assert(persistence.transactionRepository.userId === 'test-user', 'Expected transactionRepository.userId=test-user');
        assert(persistence.budgetRepository.userId === 'test-user', 'Expected budgetRepository.userId=test-user');
        assert(persistence.goalRepository.userId === 'test-user', 'Expected goalRepository.userId=test-user');
      });

      await runTest('Account: save and loadAll via persistence graph', async () => {
        const account = {
          id: 'acc-1',
          userId: 'test-user',
          name: 'Konto',
          type: 'bank',
          icon: 'landmark',
          color: '#0000FF',
          archived: false,
          createdAt: '2024-01-01T00:00:00Z',
          updatedAt: '2024-01-01T00:00:00Z',
        };
        await persistence.accountRepository.save(account);
        const all = await persistence.accountRepository.loadAll();
        assert(all.length === 1, 'Expected 1 account');
        assertDeepEqual(all[0], account);
      });

      await runTest('Transaction: save and findByMonth via persistence graph', async () => {
        const tx = {
          id: 'tx-1',
          userId: 'test-user',
          accountId: 'acc-1',
          amount: 100,
          type: 'expense',
          categoryId: 'cat-1',
          description: 'Test',
          date: '2024-01-15',
          notes: '',
          metadata: {},
          archived: false,
          createdAt: '2024-01-01T00:00:00Z',
          updatedAt: '2024-01-01T00:00:00Z',
        };
        await persistence.transactionRepository.save(tx);
        const month = await persistence.transactionRepository.findByMonth('2024-01');
        assert(month.length === 1, 'Expected 1 February transaction');
        assert(month[0].id === 'tx-1', 'Expected tx-1');
      });

      await runTest('Budget: findByCategory via persistence graph', async () => {
        const budget = {
          id: 'budget-1',
          userId: 'test-user',
          categoryId: 'cat-1',
          amount: 500,
          period: 'monthly',
          archived: false,
          createdAt: '2024-01-01T00:00:00Z',
          updatedAt: '2024-01-01T00:00:00Z',
        };
        await persistence.budgetRepository.save(budget);
        const found = await persistence.budgetRepository.findByCategory('cat-1');
        assert(found.length === 1, 'Expected 1 budget for cat-1');
        assert(found[0].id === 'budget-1', 'Expected budget-1');
      });

      await runTest('Category: findSystem via persistence graph', async () => {
        await persistence.categoryRepository.save({
          id: 'cat-sys',
          userId: 'test-user',
          name: 'Savings',
          type: 'expense',
          icon: 'piggy-bank',
          color: '#00FF00',
          parentId: null,
          isSystem: true,
          systemRole: 'savings',
          archived: false,
          createdAt: '2024-01-01T00:00:00Z',
          updatedAt: '2024-01-01T00:00:00Z',
        });
        const system = await persistence.categoryRepository.findSystem();
        assert(system.length === 1, 'Expected 1 system category');
        assert(system[0].systemRole === 'savings', 'Expected systemRole=savings');
      });

      await runTest('Goal: save and loadAll via persistence graph', async () => {
        const goal = {
          id: 'goal-1',
          userId: 'test-user',
          name: 'Laptop',
          target: 5000,
          current: 0,
          currentLastRebuiltAt: null,
          deadline: '2024-12-31',
          icon: 'laptop',
          color: '#0000FF',
          priority: 'medium',
          archived: false,
          createdAt: '2024-01-01T00:00:00Z',
          updatedAt: '2024-01-01T00:00:00Z',
        };
        await persistence.goalRepository.save(goal);
        const all = await persistence.goalRepository.loadAll();
        assert(all.length === 1, 'Expected 1 goal');
        assertDeepEqual(all[0], goal);
      });

      await runTest('User: save and findById via persistence graph', async () => {
        const user = {
          id: 'user-1',
          createdAt: '2024-01-01T00:00:00Z',
          updatedAt: '2024-01-01T00:00:00Z',
          settings: {
            currency: 'PLN',
            theme: 'system',
            accent: 'purple',
            privacyMode: false,
            excludeInvestmentsFromNetWorth: false,
          },
        };
        await persistence.userRepository.save(user);
        const found = await persistence.userRepository.findById('user-1');
        assertDeepEqual(found, user);
      });

      output.textContent = results.join('\n') + '\n\nTotal: ' + (passed + failed) + ' | Passed: ' + passed + ' | Failed: ' + failed;
      window.__testResults = { passed, failed, total: passed + failed, results };
    }

    runAllTests().catch(e => {
      output.textContent = 'FATAL: ' + e.message;
    });
  </script>
</body>
</html>
